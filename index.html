</div>
<script>
const motto = document.querySelector('#motto');
const subtitles = [
  motto.textContent,
  'WATCH THIS',
  'CHALLENGE ACCEPTED',
  'DON\'T STOP',
  'BRING IT ON',
  'NO HOLDING BACK',
];
let theme = 0;
function set() {
  document.documentElement.dataset.theme = theme;
  motto.textContent = subtitles[theme];
}
function prev() {
  if (--theme < 0) theme = 5;
  set();
}
function next() {
  if (++theme > 5) theme = 0;
  set();
}
document.body.addEventListener('keydown', (ev) => {
  if (ev.code === 'ArrowLeft') prev();
  else if (ev.code === 'ArrowRight') next();
});
document.getElementById('logo').addEventListener('click', next);
</script>
