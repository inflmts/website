<html lang="en">
<head>

  <title>INFINITELIMITS</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="main.css">
</head>
<body>
<div class="wrapper">

<header>
<button id="logo" title="InfiniteLimits Logo v5.4">
<svg class="decoration" viewBox="-352 -352 704 704">
  <path d="M 160,-260 -40,270 -250,-60 Z" fill="none" stroke="currentColor" stroke-width="16" />
</svg>
<svg viewBox="-176 -176 352 352" fill="white">
  <path opacity="0.375" d="
     M -100.2,24.3 -100.2,74.3 -80,124.8 -80,74.8 Z
     M 100.2,-24.3 100.2,-74.3 80,-124.8 80,-74.8 Z
     " />
  <path d="
     M -100,-52.8 -144,-35.2 -100,74.8 -100,24.8 -119.862,-24.855 -100,-32.8 Z
     M -10,-110 -80,-110 -80,-28.8 -10,-56.8 Z
     M -10,-36.8 -80,-8.8 -80,124.8 -10,96.8 Z
     M 10,36.8 80,8.8 80,-124.8 10,-96.8 Z
     M 10,110 80,110 80,28.8 10,56.8 Z
     M 100,52.8 144,35.2 100,-74.8 100,-24.8 119.862,24.855 100,32.8 Z
     " />
  </g>
</svg>
</button>
</header>

<main>
<svg class="title infinite" viewBox="0 0 48 8" fill="currentColor">
  <title>INFINITE</title>
  <path opacity="0.5" d="M11,0
    v2 h12 v-2 z m2,2
    v1 h3 v-1 z m6,0
    v1 h3 v-1 z m11,-2
    v2 h2 v-2 z m2,2
    v1 h3 v-1 z m8,0
    v1 h3 v-1 z
    " />
  <path d="M0,0
    v8 h3 v-8 z m4,0
    v8 h3 v-4 l2,4 h3 v-5.8 l-1.1,-2.2 h-1.9 v4 l-2,-4 z m8,0
    l1,2 h9 v-2 z m1,3 v5 h3 v-3 h2 v-2 z m6,0
    v5 h3 v-5 z m4,-3
    v8 h3 v-4 l2,4 h3 v-5.8 l-1.1,-2.2 h-1.9 v4 l-2,-4 z m9,3
    v5 h3 v-5 z m-1,-3
    l1,2 h4 v6 h3 v-6 h8 v-2 z m9,3
    v5 h8 l-1,-2 h-4 v-1 h3 v-2 z
    " />
</svg>
<svg class="title limits" viewBox="0 0 35 8" fill="currentColor">
  <title>LIMITS</title>
  <path opacity="0.375" d="M4,5
    v1 h3 v-1 z m3,1

    v5.8 l1.1,2.2 h1.9 v-4 l2,4 l2,-4 v4 h3 v-8 h-3 l-2,4 l-2,-4 z m11,3
    v5 h3 v-5 z m0,-3
    v2 h4 v6 h1.9 l1.1,-2.2 v-3.8 h8 l1,-2 z m9,3
    v2 h3 v1 h-4 l-1,2 h8 v-5 z
    " />
</svg>
<p id="motto">ZERO TO INFINITY</p>
<p>
I am <strong>Daniel Li</strong>,
a programmer, artist, and musician who likes aesthetics and open source.
I'm currently studying computer science at the University of Florida.
Welcome to my personal website!
</p>
</main>

</div>
<script>
const motto = document.querySelector('#motto');
const subtitles = [
  motto.textContent,
  'WATCH THIS',
  'CHALLENGE ACCEPTED',
  'DON\'T STOP',
  'BRING IT ON',
  'NO HOLDING BACK',
];
let theme = 0;
function set() {
  document.documentElement.dataset.theme = theme;
  motto.textContent = subtitles[theme];
}
function prev() {
  if (--theme < 0) theme = 5;
  set();
}
function next() {
  if (++theme > 5) theme = 0;
  set();
}
document.body.addEventListener('keydown', (ev) => {
  if (ev.code === 'ArrowLeft') prev();
  else if (ev.code === 'ArrowRight') next();
});
document.getElementById('logo').addEventListener('click', next);
</script>
</body>
</html>
